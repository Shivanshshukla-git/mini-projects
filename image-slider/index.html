<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Shivansh Shukla">
    <meta name="description" content="Image-slider">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image-Slider mini-Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="slider" tabindex="0">
        <div class="image-div">
            <img id="bgImage" src="Image/beautiful-scenery.jpg" alt="Background Image">
            <img id="sliderImage" src="Image/beautiful-scenery.jpg" alt="slider image">
        </div>    

        <div id="btn">
            <button id="prevBtn" title="Previous Image">‹</button>
            <button id="nextBtn" title="Next Image">›</button>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
